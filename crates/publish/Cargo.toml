[package]
name = "fdl_publish"
version = "0.1.3"
edition = "2024"
description = "Publish quiet.md notes to GitHub Pages and content platforms (WeChat/Toutiao/Baijiahao)"
license = "MIT"
readme = "../../README.md"
authors = ["s1dashu"]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22"
regex = "1"
ureq = { version = "2.12.1", default-features = false, features = ["tls", "gzip", "json", "proxy-from-env"] }

[lints]
workspace = true
